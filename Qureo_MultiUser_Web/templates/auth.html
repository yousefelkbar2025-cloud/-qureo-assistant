<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qureo Assistant</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 70% 0%,#32275b,transparent 48%),#090b18;color:#f7f7fc;font-family:system-ui,Tahoma,Arial}.card{width:min(420px,92vw);padding:28px;border:1px solid #35304f;background:#151629eF;border-radius:22px;box-shadow:0 25px 80px #0006}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#a855c8,#6478e9);font-weight:900;font-size:23px}h1{font-size:22px;margin:15px 0 5px}.muted{color:#a4a5bb;font-size:13px}label{display:block;margin:16px 0 7px;font-size:13px;color:#d0cfe0}input{width:100%;padding:13px;border-radius:11px;border:1px solid #393952;background:#0d1020;color:white;font-size:15px}button,.link{display:block;width:100%;text-align:center;padding:13px;margin-top:16px;border:0;border-radius:11px;background:linear-gradient(100deg,#a855c8,#657be8);color:white;font-weight:700;text-decoration:none;cursor:pointer}.link{background:#282941;border:1px solid #41415b}.msg{color:#f3c98d;font-size:13px;margin-top:12px}</style></head><body><main class="card"><div class="logo">Q</div><h1>Qureo Assistant</h1><div class="muted">مساعد البحث في حلول JavaScript</div><form method="post"><label>اسم المستخدم</label><input name="username" required minlength="3" autocomplete="username"><label>كلمة المرور</label><input name="password" type="password" required minlength="8" autocomplete="new-password"><button>{{ "إنشاء حساب" if mode=="register" else "تسجيل الدخول" }}</button></form>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="msg">{{m}}</div>{% endfor %}{% endwith %}<a class="link" href="{{ url_for('login') if mode=='register' else url_for('register') }}">{{ "عندي حساب بالفعل" if mode=="register" else "إنشاء حساب جديد" }}</a></main></body></html>
